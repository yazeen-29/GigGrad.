name: Verify GigGrad
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: giggrad
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: giggrad_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U giggrad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://giggrad:test-password@localhost:5432/giggrad_test
      TEST_DATABASE_URL: postgresql://giggrad:test-password@localhost:5432/giggrad_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Gig-Grad-Server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix Gig-Grad-Server
      - run: npm --prefix Gig-Grad-Server run db:generate
      - run: npm --prefix Gig-Grad-Server run db:migrate
      - run: npm run check
