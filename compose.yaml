services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: giggrad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: giggrad
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giggrad"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  migrate:
    build:
      context: ./Gig-Grad-Server
      target: migration
    environment:
      DATABASE_URL: postgresql://giggrad:${POSTGRES_PASSWORD}@db:5432/giggrad
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: ./Gig-Grad-Server
      target: runtime
    environment:
      DATABASE_URL: postgresql://giggrad:${POSTGRES_PASSWORD}@db:5432/giggrad
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      TRUST_PROXY: "1"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  web:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
